# LINE Mini App (stafflink-app.netlify.app)
[build]
  command = "npm install && cd app && npm install && npm run build"
  publish = "app/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Admin Web App is a separate Netlify site (stafflink-admin.netlify.app)
# Build command: cd admin && npm install && npm run build
# Publish directory: admin/dist
# VITE_API_BASE must point to this main site's URL

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# /api/admin/me is handled by admin-auth.ts (not admin-me.ts)
[[redirects]]
  from = "/api/admin/me"
  to = "/.netlify/functions/admin-auth"
  status = 200

# All other /api/admin/<name> → admin-<name>.ts
[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin-:splat"
  status = 200

# GAS export endpoint
[[redirects]]
  from = "/api/export/attendance"
  to = "/.netlify/functions/export"
  status = 200

# LINE Mini App API endpoints
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# LINE Mini App SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
